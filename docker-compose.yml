version: '3.8'

services:
  backend:
    build: ./backend
    container_name: okdriver-fastapi
    ports:
      - "8000:8000"
    volumes:
      # Keep the sqlite database persisted via bind mount
      - ./backend/okdriver.db:/app/okdriver.db
    restart: unless-stopped

  django_admin:
    build: ./django_backend
    container_name: okdriver-django
    ports:
      - "8001:8001"
    volumes:
      - ./django_backend/db.sqlite3:/app/db.sqlite3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: okdriver-frontend
    ports:
      - "3000:3000"
    environment:
      # In production, replace localhost with the public IP or domain of the backend server
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
